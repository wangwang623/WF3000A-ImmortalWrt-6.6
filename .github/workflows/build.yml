name: Build WF3000A ImmortalWrt 6.6

# ══════════════════════════════════════════════════════════════
# 模式：源码仓库保持原样，所有移植改动由 prepare-source.py 在
#       克隆之后、编译之前完成。
# ══════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码引用（分支名或 commit sha）'
        required: true
        type: string
        default: openwrt-24.10-6.6
      publish_release:
        description: Publish firmware as a GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wf3000a-immortalwrt-6.6
  cancel-in-progress: false

env:
  # 你的 fork（保持与上游一致、未做任何手动修改）
  # 补丁由 prepare-source.py 在 CI 里打，源码仓库本身干干净净
  SOURCE_REPO: https://github.com/wangwang623/immortalwrt-mt798x-6.6.git
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ── 1. 取出本构建仓库（含 DTS / device.mk / 脚本 / config）──
      - name: Checkout build project
        uses: actions/checkout@v4

      # ── 2. 腾磁盘：完整编译很吃空间 ────────────────────────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -hT

      # ── 3. 装编译依赖 ─────────────────────────────────────
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev \
            gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
            libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils python3-pyelftools qemu-utils re2c rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim \
            wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"

      # ── 4. 克隆【未改动】的上游源码 ────────────────────────
      # ── 4. 克隆【未改动】的 fork 源码 ─────────────────────
      - name: Fetch source from fork
        run: |
          mkdir -p "$RUNNER_TEMP/wf3000a-build"
          git init -q "$RUNNER_TEMP/wf3000a-build/openwrt"
          git -C "$RUNNER_TEMP/wf3000a-build/openwrt" remote add origin "$SOURCE_REPO"
          git -C "$RUNNER_TEMP/wf3000a-build/openwrt" fetch --depth=1 origin "${{ inputs.source_ref }}"
          git -C "$RUNNER_TEMP/wf3000a-build/openwrt" checkout --detach FETCH_HEAD
          echo "OPENWRT=$RUNNER_TEMP/wf3000a-build/openwrt" >> "$GITHUB_ENV"
          echo "fetched: $(git -C "$RUNNER_TEMP/wf3000a-build/openwrt" rev-parse HEAD)"

      # ── 5. ★ 打补丁：四件移植工作全在这里 ──────────────────
      #    源码仓库本身不动一个字节。
      #    脚本自带复核，缺哪项 exit 1，不会白编译两小时。
      - name: Apply WF3000A board port
        run: |
          python3 scripts/prepare-source.py "$OPENWRT"

      # ── 6. 拉 feeds（LuCI 等包都在外部仓库）────────────────
      #    不覆盖 feeds.conf.default —— 直接用源码自带的官方源
      - name: Update and install feeds
        working-directory: ${{ runner.temp }}/wf3000a-build/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ── 7. 载入配置并校验关键符号 ──────────────────────────
      - name: Load and validate configuration
        working-directory: ${{ runner.temp }}/wf3000a-build/openwrt
        run: |
          cp "$GITHUB_WORKSPACE/config/wf3000a.config" .config
          make defconfig

          # ── 硬校验：缺任一项直接失败 ──────────────────────
          # ⚠️ 第一条最关键：如果 device.mk 没追加成功，这个符号根本不存在，
          #    make defconfig 会【静默丢弃】它而不报错，只能靠这里拦住，
          #    否则会花两小时编出一个别的机型（或默认机型）的固件。
          required=(
            CONFIG_TARGET_mediatek_filogic_DEVICE_kst_wf3000a
            CONFIG_PACKAGE_kmod-mediatek_hnat
            CONFIG_PACKAGE_luci
            CONFIG_LUCI_LANG_zh_Hans
          )
          for symbol in "${required[@]}"; do
            grep -qx "${symbol}=y" .config || {
              echo "::error::Required selection missing after make defconfig: $symbol" >&2
              exit 1
            }
          done
          echo "硬校验通过：机型 / HNAT / LuCI 均已选中"

          # ── 软校验：缺了不致命，只提醒 ─────────────────────
          # 这几项支撑「刷完后 opkg install」，缺了不会编译失败，
          # 但会导致刷完后连不上 https 软件源。用 warning 而非 error，
          # 避免上游改名时误伤编译。
          soft=(
            CONFIG_PACKAGE_opkg
            CONFIG_PACKAGE_ca-bundle
            CONFIG_PACKAGE_ca-certificates
          )
          for symbol in "${soft[@]}"; do
            grep -qx "${symbol}=y" .config \
              || echo "::warning::$symbol 未选中（opkg 可能无法访问 https 源，届时改用 http 源）"
          done

          # 留存一份精简配置，便于复盘
          ./scripts/diffconfig.sh | tee "$GITHUB_WORKSPACE/build.diffconfig"

      # ── 8. 预下载源码包 ───────────────────────────────────
      - name: Download sources
        working-directory: ${{ runner.temp }}/wf3000a-build/openwrt
        run: |
          make download -j8
          # 删掉小于 1KB 的文件（下载失败的残骸）
          find dl -type f -size -1024c -print -delete

      # ── 9. 编译 ───────────────────────────────────────────
      #    失败时回退到单线程 + 详细输出，便于定位错误
      - name: Build firmware
        working-directory: ${{ runner.temp }}/wf3000a-build/openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      # ── 10. 收集产物 + 校验和 ─────────────────────────────
      - name: Collect firmware and checksums
        id: collect
        run: |
          firmware_dir="$OPENWRT/bin/targets/mediatek/filogic"
          test -d "$firmware_dir"
          rm -rf "$firmware_dir/packages"
          cp build.diffconfig "$firmware_dir/wf3000a-build.diffconfig"
          (
            cd "$firmware_dir"
            find . -maxdepth 1 -type f ! -name sha256sums.txt -print0 \
              | sort -z | xargs -0 sha256sum > sha256sums.txt
          )
          echo "firmware_dir=$firmware_dir" >> "$GITHUB_OUTPUT"
          echo "release_tag=wf3000a-$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WF3000A-ImmortalWrt-6.6-${{ github.run_number }}
          path: ${{ steps.collect.outputs.firmware_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.release_tag }}
          name: WF3000A ImmortalWrt 6.6 ${{ steps.collect.outputs.release_tag }}
          body: |
            Source: wangwang623/immortalwrt-mt798x-6.6 (fork of padavanonly)
            Ref: ${{ inputs.source_ref }}
            Layout: nmbm0:1024k(bl2),512k(u-boot-env),2048k(factory),2048k(fip),116736k(ubi)
            MAC: LAN=48:da:35:50:70:f5  WAN=48:da:35:50:70:f6

            纯净固件：官方默认包 + LuCI(中文) + HNAT 硬件加速，无第三方插件。
            首次刷入：U-Boot Web（192.168.1.1，布局选 114m）上传 factory.bin
            后续升级：sysupgrade -n /tmp/xxx-sysupgrade.bin
          files: ${{ steps.collect.outputs.firmware_dir }}/*
