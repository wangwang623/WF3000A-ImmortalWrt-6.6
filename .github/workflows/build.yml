name: Build WF3000A ImmortalWrt 6.6

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish firmware as a GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wf3000a-immortalwrt-6.6
  cancel-in-progress: false

env:
  SOURCE_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  SOURCE_BRANCH: openwrt-24.10-6.6
  SOURCE_COMMIT: ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout build project
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -hT

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev \
            gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
            libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils python3-pyelftools qemu-utils re2c rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim \
            wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"

      - name: Fetch pinned ImmortalWrt source
        run: |
          mkdir -p "$RUNNER_TEMP/wf3000a-build"
          git init -q "$RUNNER_TEMP/wf3000a-build/openwrt"
          git -C "$RUNNER_TEMP/wf3000a-build/openwrt" remote add origin "$SOURCE_REPO"
          git -C "$RUNNER_TEMP/wf3000a-build/openwrt" fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C "$RUNNER_TEMP/wf3000a-build/openwrt" checkout --detach FETCH_HEAD
          echo "OPENWRT=$RUNNER_TEMP/wf3000a-build/openwrt" >> "$GITHUB_ENV"
          test "$(git -C "$RUNNER_TEMP/wf3000a-build/openwrt" rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Add WF3000A board support
        run: |
          python3 scripts/prepare-source.py "$OPENWRT"
          # 不再调用 prepare-packages.sh —— 纯净固件不拉任何第三方插件。
          # 不再覆盖 feeds.conf.default —— 用源码自带的官方源。
          # 不再拷贝 files/ —— 没有需要预置的自定义配置。

      - name: Update and install feeds
        working-directory: ${{ runner.temp }}/wf3000a-build/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load and validate configuration
        working-directory: ${{ runner.temp }}/wf3000a-build/openwrt
        run: |
          cp "$GITHUB_WORKSPACE/config/wf3000a.config" .config
          make defconfig

          # 只校验「能不能跑起来」的最小集合，不校验任何插件。
          required=(
            CONFIG_TARGET_mediatek_filogic_DEVICE_kst_wf3000a
            CONFIG_PACKAGE_kmod-mediatek_hnat
            CONFIG_PACKAGE_luci
          )
          for symbol in "${required[@]}"; do
            grep -qx "${symbol}=y" .config || {
              echo "Required selection missing after make defconfig: $symbol" >&2
              exit 1
            }
          done

          # 确认 DTS 是 114MiB 布局（原版这里查的是 248MiB 的 0x0f280000）
          grep -n 'reg = <0x0580000 0x07200000>;' \
            target/linux/mediatek/dts/mt7981b-kst-wf3000a.dts

          # 确认机型已注册进镜像构建
          grep -n 'define Device/kst_wf3000a' \
            target/linux/mediatek/image/filogic.mk

          ./scripts/diffconfig.sh | tee "$GITHUB_WORKSPACE/build.diffconfig"

      - name: Download sources
        working-directory: ${{ runner.temp }}/wf3000a-build/openwrt
        run: |
          make download -j8
          find dl -type f -size -1024c -print -delete

      - name: Build firmware
        working-directory: ${{ runner.temp }}/wf3000a-build/openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect firmware and checksums
        id: collect
        run: |
          firmware_dir="$OPENWRT/bin/targets/mediatek/filogic"
          test -d "$firmware_dir"
          rm -rf "$firmware_dir/packages"
          cp build.diffconfig "$firmware_dir/wf3000a-build.diffconfig"
          (
            cd "$firmware_dir"
            find . -maxdepth 1 -type f ! -name sha256sums.txt -print0 \
              | sort -z | xargs -0 sha256sum > sha256sums.txt
          )
          echo "firmware_dir=$firmware_dir" >> "$GITHUB_OUTPUT"
          echo "release_tag=wf3000a-$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WF3000A-ImmortalWrt-6.6-${{ github.run_number }}
          path: ${{ steps.collect.outputs.firmware_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.release_tag }}
          name: WF3000A ImmortalWrt 6.6 ${{ steps.collect.outputs.release_tag }}
          body: |
            Source: padavanonly/immortalwrt-mt798x-6.6
            Branch: openwrt-24.10-6.6
            Commit: ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8
            Layout: nmbm0:1024k(bl2),512k(u-boot-env),2048k(factory),2048k(fip),116736k(ubi)
            纯净固件：官方默认包 + LuCI(中文) + HNAT 硬件加速，无第三方插件。
            更新方式：U-Boot Web（192.168.1.1，布局选 114m）上传 factory.bin。
          files: ${{ steps.collect.outputs.firmware_dir }}/*
